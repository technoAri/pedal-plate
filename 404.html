<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Pedal Plate</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=optional">
<style>
  :root{--bg:#FBF6EC;--ink:#2B2620;--ink-soft:#6B5F51;--brand:#96601A;--on-brand:#FBF6EC;}
  @media (prefers-color-scheme: dark){:root{--bg:#1E1A15;--ink:#F3EAD9;--ink-soft:#C9BBA6;--brand:#E3AD57;color-scheme:dark;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
    background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  img{width:72px;height:72px;border-radius:50%;margin:0 auto 20px;display:block;}
  .code{font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);}
  h1{margin:10px 0 0;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;line-height:1.15;}
  p{margin:12px auto 0;max-width:40ch;color:var(--ink-soft);line-height:1.6;}
  a{display:inline-block;margin-top:26px;padding:14px 26px;border-radius:999px;background:#96601A;color:var(--on-brand);
    font-weight:600;text-decoration:none;}
  a:focus-visible{outline:3px solid var(--brand);outline-offset:3px;}
</style>
</head>
<body>
  <main>
    <img src="/images/logo.png" alt="Pedal Plate logo" width="72" height="72">
    <div class="code">Error 404</div>
    <h1>This stop isn't on our route.</h1>
    <p>The page you're looking for has moved or doesn't exist. Let's get you back to the food.</p>
    <a href="/">Back to Pedal Plate</a>
  </main>
</body>
</html>
